    <main>
        <!-- CARD DO MULTÍMIDIA TÍTULO -->
        <section class="card-titulo">
            <h2>Multimídia</h2>
        </section>

        <div class="cards">

            <!-- VÍDEO -->
            <!--CARD DO VÍDEO DAS CAPAS DOS JORNAIS DA II GUERRA MUNDIAL DIA D-->
            <article class="card">
                <h3>Vídeo</h3>
                <figure class="midia">
                    <video controls>
                        <source src="multimidia/Dia_D_jornais.mp4" type="video/mp4">
                    </video>
                    <figcaption><strong>II Guerra Mundial - DIA D - Jornais da epóca - 06-06-1944.</strong></figcaption>
                </figure>
            </article>

            <!-- ÁUDIO -->
            <!-- CARD DO ÁUDIO DO RÁDIO REPORTAGEM DA ROTA DO GRAFITE EM SÃO PAULO-->
            <article class="card">
                <h3>Áudio</h3>
                <figure class="midia">
                    <audio controls>
                        <source src="multimidia/ROTA-DO-GRAFITE-SP.mp3" type="audio/mpeg">

                    </audio>
                    <figcaption><strong>Reportagem em Rádio - Rota do Grafite em São Paulo.</strong></figcaption>
                </figure>
            </article>

            <!-- YOUTUBE -->
            <!--CARD DO YOUTUBE-->
            <article class="card">
                <h3>Vídeo do YouTube</h3>
                <figure class="midia">
                    <div class="video-container">
                        <iframe src="https://www.youtube.com/embed/X1aFkAkFASk?si=glujsFlFJ_McLsrL"
                            title="YouTube video player"
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                            referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
                    </div>
                    <figcaption><strong>Legendado - Vingadores - Doutor Destino.</strong></figcaption>
                </figure>
            </article>

        </div>
    </main>
