<body>

    <header class="cabecalho">
        <h1>JC</h1>

    <main id="conteudo" tabindex="-1">
        <!-- CARD DO MULTÍMIDIA TÍTULO -->
        <section class="card-titulo">
            <h2>Multimídia</h2>
        </section>

        <div class="cards">

            <!-- VÍDEO -->
            <!--CARD DO VÍDEO DAS CAPAS DOS JORNAIS DA II GUERRA MUNDIAL DIA D-->
            <article class="card">
                <h3>Vídeo</h3>
                <figure class="midia">
                    <video controls aria-describedby="alt-video">
                        <source src="multimidia/Dia_D_jornais.mp4" type="video/mp4">
                    </video>
                    <figcaption><strong>II Guerra Mundial - DIA D - Jornais da epóca - 06-06-1944.</strong></figcaption>
                    <!-- ALTERNATIVA EM TEXTO: quem não enxerga ou não consegue ver o vídeo tem a descrição -->
                    <details>
                        <summary>Descrição do vídeo em texto</summary>
                        <p id="alt-video">O vídeo exibe uma foto em preto e branco de soldados aliados desembarcando de
                            uma lancha na praia, seguida das primeiras páginas de jornais de 6 de junho de 1944 que
                            noticiaram o Dia D: Diário de Notícias (Portugal), O Estado de S. Paulo e outros jornais com
                            manchetes como "A invasão da Europa", "Começou a invasão" e "Combates na França".</p>
                    </details>
                </figure>
            </article>

            <!-- ÁUDIO -->
            <!-- CARD DO ÁUDIO DO RÁDIO REPORTAGEM DA ROTA DO GRAFITE EM SÃO PAULO-->
            <article class="card">
                <h3>Áudio</h3>
                <figure class="midia">
                    <audio controls>
                        <source src="multimidia/ROTA-DO-GRAFITE-SP.mp3" type="audio/mpeg">

                    </audio>
                    <figcaption><strong>Reportagem em Rádio - Rota do Grafite em São Paulo.</strong></figcaption>
                </figure>
            </article>

            <!-- YOUTUBE -->
            <!--CARD DO YOUTUBE-->
            <article class="card">
                <h3>Vídeo do YouTube</h3>
                <figure class="midia">
                    <div class="video-container">
                        <iframe src="https://www.youtube.com/embed/X1aFkAkFASk?si=glujsFlFJ_McLsrL"
                            title="Vídeo do YouTube: Vingadores - Doutor Destino (legendado)"
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                            referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
                    </div>
                    <figcaption><strong>Legendado - Vingadores - Doutor Destino.</strong></figcaption>
                </figure>
            </article>

        </div>
    </main>
